<!DOCTYPE html>
<html lang="hr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prijava radnika</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root { --pozadina:#0f1720; --ploca:#1b2633; --tekst:#f2f5f8; --siva:#8a99a8; --zelena:#1f9d55; --plava:#2b6cb0; --crvena:#c53030; --narancasta:#dd6b20; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--pozadina); color:var(--tekst); font-family:Roboto, Arial, sans-serif; overflow:hidden; user-select:none; }
  .app { display:flex; flex-direction:column; height:100%; max-width:520px; margin:0 auto; padding:10px 14px 14px; gap:10px; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  .firma { font-size:17px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60%; }
  .sat { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .datum { color:var(--siva); font-size:13px; text-align:right; }
  .kamera { position:relative; flex:1 1 38%; min-height:150px; background:#000; border-radius:14px; overflow:hidden; }
  .kamera video { width:100%; height:100%; object-fit:cover; }
  .kamera video.zrcalo { transform:scaleX(-1); }
  .okvir { position:absolute; inset:18% 22%; border:3px solid rgba(255,255,255,.75); border-radius:12px; pointer-events:none; }
  .kamera .info { position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:14px; color:#fff; text-shadow:0 1px 3px #000; }
  .kamera button.okreni { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.5); color:#fff; border:0; border-radius:20px; padding:8px 12px; font-size:13px; }
  .pin-prikaz { display:flex; justify-content:center; gap:12px; height:28px; align-items:center; }
  .pin-prikaz span { width:16px; height:16px; border-radius:50%; border:2px solid var(--siva); }
  .pin-prikaz span.pun { background:var(--tekst); border-color:var(--tekst); }
  .tipke { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; flex:0 0 auto; }
  .tipke button { height:clamp(48px,8.5vh,72px); font-size:26px; font-weight:600; border:0; border-radius:12px; background:var(--ploca); color:var(--tekst); }
  .tipke button:active { background:#2a3a4d; }
  .tipke .ok { background:var(--plava); font-size:20px; }
  .tipke .brisi { font-size:20px; }
  .napomena { color:var(--siva); font-size:12px; text-align:center; }
  .poruka { position:fixed; inset:0; display:none; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:24px; z-index:10; }
  .poruka.vidljiva { display:flex; }
  .poruka.dolazak { background:var(--zelena); } .poruka.odlazak { background:var(--plava); }
  .poruka.greska { background:var(--crvena); } .poruka.ponovljeno { background:var(--narancasta); }
  .poruka .vrsta { font-size:44px; font-weight:800; letter-spacing:1px; }
  .poruka .ime { font-size:30px; margin-top:12px; font-weight:600; }
  .poruka .vrijeme { font-size:64px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; }
  .poruka .dodatno { font-size:17px; margin-top:14px; opacity:.9; }
  .demo { background:var(--narancasta); color:#000; text-align:center; font-size:12px; border-radius:6px; padding:3px; }
</style>
</head>
<body>
<div class="app">
  <div class="demo" id="demo" hidden>PROBNI NAČIN (nije spojeno na Google tablicu) – PIN 1234 / 5678</div>
  <header>
    <div class="firma" id="firma">Prijava radnika</div>
    <div><div class="sat" id="sat">--:--</div><div class="datum" id="datum"></div></div>
  </header>

  <div class="kamera" id="kamera">
    <video id="video" playsinline muted></video>
    <div class="okvir"></div>
    <button class="okreni" id="okreni" type="button">↺ kamera</button>
    <div class="info" id="kamInfo">Prinesite QR karticu kameri</div>
  </div>

  <div class="pin-prikaz" id="pinPrikaz"></div>
  <div class="tipke" id="tipke"></div>
  <div class="napomena">ili upišite PIN pa OK · dolazak/odlazak se određuje sam</div>
</div>

<div class="poruka" id="poruka">
  <div class="vrsta" id="pVrsta"></div>
  <div class="ime" id="pIme"></div>
  <div class="vrijeme" id="pVrijeme"></div>
  <div class="dodatno" id="pDodatno"></div>
</div>

<canvas id="platno" hidden></canvas>
<script>
// ---------------------------------------------------------------- postavke (Apps Script ih ubacuje)
var CFG = { firma: '<?= firma ?>', kljuc: '<?= kljuc ?>', terminal: '<?= terminal ?>', apiUrl: '<?= apiUrl ?>' };
var IZ_GOOGLEA = CFG.kljuc.indexOf('<' + '?') !== 0;   // NE pisati spojeno: Google bi to čitao kao svoju oznaku
var SAMOSTALNO = false, DEMO = false;
if (!IZ_GOOGLEA) {
  // samostalna stranica (GitHub Pages): index.html?api=<Web app URL>&k=<KLJUC_TERMINALA>&f=<firma>&t=<terminal>
  var q = new URLSearchParams(location.search);
  if (q.get('api') && q.get('k')) {
    SAMOSTALNO = true;
    CFG = { firma: q.get('f') || 'Prijava radnika', kljuc: q.get('k'), terminal: q.get('t') || 'Mobitel', apiUrl: q.get('api') };
  } else {
    DEMO = true;
    CFG.firma = 'PROBNA FIRMA d.o.o.';
    document.getElementById('demo').hidden = false;
  }
}
var PIN_DULJINA = 4;
document.getElementById('firma').textContent = CFG.firma;

// ---------------------------------------------------------------- sat
function osvjeziSat() {
  var d = new Date();
  document.getElementById('sat').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  var dani = ['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'];
  document.getElementById('datum').textContent = dani[d.getDay()] + ', ' + d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear() + '.';
}
osvjeziSat(); setInterval(osvjeziSat, 5000);

// ---------------------------------------------------------------- slanje
var zauzeto = false;
function posalji(nacin, vrijednost) {
  if (zauzeto) return;
  zauzeto = true;
  var gotovo = function (r) { zauzeto = false; prikazi(r); };
  var greska = function (e) { zauzeto = false; prikazi({ ok: false, poruka: 'Nema veze s poslužiteljem. Pokušajte ponovno.' }); };
  if (DEMO) return setTimeout(function () { gotovo(demoPrijava(nacin, vrijednost)); }, 300);
  if (!SAMOSTALNO && window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(gotovo).withFailureHandler(greska)
      .prijava(CFG.kljuc, nacin, vrijednost, CFG.terminal);
  } else {
    fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ k: CFG.kljuc, nacin: nacin, vrijednost: vrijednost, terminal: CFG.terminal }) })
      .then(function (r) { return r.json(); }).then(gotovo).catch(greska);
  }
}

// probni način: lokalno, bez Googlea
var demoRadnici = { '1234': 'Ana Anić', '5678': 'Marko Marić', 'R-DEMOQR': 'Ivana Ivić' };
var demoZadnje = {};
function demoPrijava(nacin, v) {
  var ime = demoRadnici[v];
  if (!ime) return { ok: false, poruka: nacin === 'QR' ? 'Nepoznata QR kartica.' : 'Pogrešan PIN.' };
  var sad = new Date(), z = demoZadnje[ime];
  var sat = ('0' + sad.getHours()).slice(-2) + ':' + ('0' + sad.getMinutes()).slice(-2);
  if (z && sad - z.t < 10000) return { ok: true, ponovljeno: true, ime: ime, vrsta: z.vrsta, sat: z.sat, poruka: 'Već zabilježeno' };
  var vrsta = (z && z.vrsta === 'DOLAZAK') ? 'ODLAZAK' : 'DOLAZAK';
  demoZadnje[ime] = { t: sad, vrsta: vrsta, sat: sat };
  return { ok: true, ime: ime, vrsta: vrsta, sat: sat, poruka: '' };
}

// ---------------------------------------------------------------- prikaz rezultata
var porukaTimer;
function prikazi(r) {
  var el = document.getElementById('poruka');
  el.className = 'poruka vidljiva ' + (!r.ok ? 'greska' : r.ponovljeno ? 'ponovljeno' : r.vrsta === 'ODLAZAK' ? 'odlazak' : 'dolazak');
  document.getElementById('pVrsta').textContent = !r.ok ? 'GREŠKA' : r.vrsta;
  document.getElementById('pIme').textContent = r.ok ? r.ime : '';
  document.getElementById('pVrijeme').textContent = r.ok ? r.sat : '';
  document.getElementById('pDodatno').textContent = r.ok ? (r.ponovljeno ? 'Već zabilježeno – ne treba ponovno' : (r.poruka || (r.vrsta === 'DOLAZAK' ? 'Dobar dan!' : 'Doviđenja!'))) : r.poruka;
  zvuk(r.ok && !r.ponovljeno);
  if (navigator.vibrate) navigator.vibrate(r.ok ? 120 : [80, 60, 80]);
  clearTimeout(porukaTimer);
  porukaTimer = setTimeout(function () { el.className = 'poruka'; }, r.ok ? 3000 : 3500);
}
var porukaEl = document.getElementById('poruka');
porukaEl.addEventListener('click', function () { porukaEl.className = 'poruka'; });

var audio;
function zvuk(dobro) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    var o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = dobro ? 880 : 220; g.gain.value = 0.15;
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (dobro ? 0.15 : 0.4));
  } catch (e) {}
}

// ---------------------------------------------------------------- PIN tipkovnica
var pin = '';
function crtajPin() {
  var h = '';
  for (var i = 0; i < PIN_DULJINA; i++) h += '<span class="' + (i < pin.length ? 'pun' : '') + '"></span>';
  document.getElementById('pinPrikaz').innerHTML = h;
}
['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(function (t) {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = t;
  if (t === 'OK') b.className = 'ok';
  if (t === '⌫') b.className = 'brisi';
  b.addEventListener('click', function () {
    if (t === '⌫') pin = pin.slice(0, -1);
    else if (t === 'OK') { if (pin.length) { posalji('PIN', pin); pin = ''; } }
    else if (pin.length < 8) pin += t;
    crtajPin();
  });
  document.getElementById('tipke').appendChild(b);
});
crtajPin();

// ---------------------------------------------------------------- QR kamera
var video = document.getElementById('video'), platno = document.getElementById('platno');
var ctx = platno.getContext('2d', { willReadFrequently: true });
var detektor = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
var smjer = 'user', tok = null, zadnjiKod = '', zadnjiKodT = 0;

function pokreniKameru() {
  if (tok) tok.getTracks().forEach(function (t) { t.stop(); });
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    document.getElementById('kamInfo').textContent = 'Kamera nije dostupna – koristite PIN';
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: smjer, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
    .then(function (s) {
      tok = s; video.srcObject = s; video.className = smjer === 'user' ? 'zrcalo' : '';
      video.play(); document.getElementById('kamInfo').textContent = 'Prinesite QR karticu kameri';
    })
    .catch(function (e) {
      document.getElementById('kamInfo').textContent = 'Kamera nije dopuštena (' + e.name + ') – koristite PIN';
    });
}
document.getElementById('okreni').addEventListener('click', function () {
  smjer = smjer === 'user' ? 'environment' : 'user'; pokreniKameru();
});

function obradiKod(kod) {
  kod = String(kod || '').trim();
  if (!kod) return;
  var sad = Date.now();
  if (kod === zadnjiKod && sad - zadnjiKodT < 5000) return;   // ista kartica ispred kamere
  zadnjiKod = kod; zadnjiKodT = sad;
  posalji('QR', kod);
}

function skeniraj() {
  if (!zauzeto && video.readyState >= 2 && !document.getElementById('poruka').classList.contains('vidljiva')) {
    if (detektor) {
      detektor.detect(video).then(function (k) { if (k.length) obradiKod(k[0].rawValue); }).catch(function () {});
    } else if (window.jsQR) {
      var w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        platno.width = w; platno.height = h; ctx.drawImage(video, 0, 0, w, h);
        var r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
        if (r) obradiKod(r.data);
      }
    }
  }
  setTimeout(skeniraj, 250);
}
pokreniKameru();
skeniraj();

// ekran ne gasi (Chrome Android)
if (navigator.wakeLock) {
  var zahtjevBudan = function () { navigator.wakeLock.request('screen').catch(function () {}); };
  zahtjevBudan();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') zahtjevBudan(); });
}
</script>
</body>
</html>
